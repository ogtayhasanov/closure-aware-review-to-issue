[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closure-aware-tosem-artifact"
version = "1.0.0"
description = "Offline reproducer for the TOSEM closure-aware review-to-issue response artifact"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

